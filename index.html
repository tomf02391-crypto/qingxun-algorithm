<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TG 用户名筛查 · 纯前端版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0d1321; --card: #182136; --card2: #1f2a45; --line: #2a3752;
    --text: #e8eefc; --muted: #8b98b8;
    --blue: #2aabee; --green: #34d399; --red: #f87171; --amber: #fbbf24;
    --t0: #ffd700; --t1: #c084fc; --t2: #60a5fa; --t3: #22d3ee;
    --t4: #4ade80; --t5: #94a3b8;
  }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 500px at 80% -10%, #1b2a4a 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh; padding-bottom: 40px;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
  header .logo {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--blue), #5b8cff);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
  }
  header h1 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  header .badge { font-size: 11px; color: var(--muted); background: var(--card); border: 1px solid var(--line); padding: 3px 8px; border-radius: 20px; }
  .tabs { display: flex; gap: 8px; padding: 6px 16px 14px; }
  .tab {
    flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .2s;
  }
  .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  main { padding: 0 16px; }
  .panel { display: none; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 12px; color: var(--text); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
  input, select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); font-size: 15px; outline: none;
  }
  input:focus, select:focus { border-color: var(--blue); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; margin-top: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.green { background: var(--green); color: #06281b; }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.small { width: auto; padding: 7px 14px; font-size: 13px; margin-top: 6px; border-radius: 8px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .hidden { display: none !important; }
  .res-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
  .res-avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; object-fit: cover; background: var(--card2); }
  .res-info { flex: 1; min-width: 0; }
  .res-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .res-name { font-size: 16px; font-weight: 700; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700; }
  .tag.ok { background: rgba(52,211,153,.15); color: var(--green); }
  .tag.no { background: rgba(251,191,36,.15); color: var(--amber); }
  .tag.user { background: rgba(42,171,238,.15); color: var(--blue); }
  .tag.channel { background: rgba(96,165,250,.15); color: #93c5fd; }
  .tag.group { background: rgba(34,211,238,.15); color: var(--t3); }
  .tag.bot { background: rgba(192,132,252,.15); color: var(--t1); }
  .res-sub { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  .res-desc { font-size: 13px; color: var(--text); margin-top: 6px; opacity: .85; }
  .res-link { font-size: 12px; color: var(--blue); margin-top: 6px; word-break: break-all; }
  .progress-track { background: var(--card2); border-radius: 20px; height: 10px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .5s; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card2); border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .grade-block { margin-bottom: 14px; }
  .grade-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .grade-dot { width: 10px; height: 10px; border-radius: 50%; }
  .grade-head b { font-size: 14px; }
  .grade-head span { font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; background: var(--card2); border: 1px solid var(--line); padding: 5px 10px; border-radius: 8px; cursor: pointer; user-select: none; }
  .chip.copied { border-color: var(--green); color: var(--green); }
  .g-t0 { background: rgba(255,215,0,.12); color: var(--t0); border-color: rgba(255,215,0,.35); }
  .g-t1 { background: rgba(192,132,252,.12); color: var(--t1); border-color: rgba(192,132,252,.35); }
  .g-t2 { background: rgba(96,165,250,.12); color: var(--t2); border-color: rgba(96,165,250,.35); }
  .g-t3 { background: rgba(34,211,238,.12); color: var(--t3); border-color: rgba(34,211,238,.35); }
  .g-t4 { background: rgba(74,222,128,.12); color: var(--t4); border-color: rgba(74,222,128,.35); }
  .g-t5 { background: rgba(148,163,184,.12); color: var(--t5); border-color: rgba(148,163,184,.35); }
  .empty { font-size: 13px; color: var(--muted); padding: 6px 0; }
  .msg { font-size: 13px; color: var(--amber); margin-top: 8px; }
  .err { font-size: 13px; color: var(--red); margin-top: 8px; }
  .desc { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .divider { height: 1px; background: var(--line); margin: 12px 0; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">TG</div>
  <h1>用户名筛查</h1>
  <span class="badge">纯前端版</span>
</header>

<div class="tabs">
  <button class="tab active" data-tab="lookup">快速查询</button>
  <button class="tab" data-tab="scan">批量筛查</button>
</div>

<main>
  <!-- ============ 快速查询 ============ -->
  <section id="tab-lookup" class="panel active">
    <div class="card">
      <h3>查询用户名信息</h3>
      <label>用户名（支持逗号分隔多个）</label>
      <input id="lu-name" placeholder="如 news, wallet, my_group">
      <div class="desc">纯浏览器查询，经公共 CORS 代理访问 t.me。代理不稳定时结果可能失败，可稍后重试。</div>
      <button class="btn primary" id="lu-btn" onclick="doLookup()">查询</button>
      <div id="lu-msg"></div>
    </div>
    <div id="lu-results"></div>
  </section>

  <!-- ============ 批量筛查 ============ -->
  <section id="tab-scan" class="panel">
    <div class="card">
      <h3>批量筛查（浏览器内执行）</h3>
      <label>模式</label>
      <select id="sc-mode" onchange="toggleModeFields()">
        <option value="words">词表筛查（407 个内置词，最快）</option>
        <option value="length">全量组合（T0 神级池）</option>
        <option value="random">随机抽样</option>
        <option value="dict">粘贴字典（每行一个）</option>
      </select>

      <div id="f-words" class="mode-fields">
        <label>附加词（可选，逗号或空格分隔）</label>
        <input id="sc-extra" placeholder="如 mybrand, supername">
        <div class="desc">内置 407 个常见词/品牌词/行业词/硬拼音，可叠加自己的词。</div>
      </div>
      <div id="f-length" class="mode-fields hidden">
        <div class="row">
          <div><label>长度</label><input type="number" id="sc-length" value="4" min="1" max="8"></div>
          <div><label>字符集</label>
            <select id="sc-charset">
              <option value="lowercase">a-z</option>
              <option value="alnum_under">a-z0-9_</option>
              <option value="digits">0-9</option>
            </select>
          </div>
        </div>
        <div class="desc">4 位纯字母约 45.7 万（T0 池，浏览器内跑极慢，建议只测前若干条或改用随机模式）；5 位纯字母约 1188 万，不适合浏览器全量。</div>
      </div>
      <div id="f-random" class="mode-fields hidden">
        <div class="row">
          <div><label>数量</label><input type="number" id="sc-count" value="200" min="10"></div>
          <div><label>字符集</label>
            <select id="sc-charset-r">
              <option value="lowercase">a-z</option>
              <option value="alnum_under">a-z0-9_</option>
              <option value="digits">0-9</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div><label>最小长度</label><input type="number" id="sc-min" value="5" min="1"></div>
          <div><label>最大长度</label><input type="number" id="sc-max" value="5" min="1" max="12"></div>
        </div>
      </div>
      <div id="f-dict" class="mode-fields hidden">
        <label>字典内容（每行一个用户名）</label>
        <input id="sc-dict" placeholder="如 news&#10;wallet&#10;my_group">
      </div>

      <div class="row">
        <div><label>并发</label><input type="number" id="sc-workers" value="3" min="1" max="10"></div>
        <div><label>延迟(秒)</label><input type="number" id="sc-delay" value="1.0" min="0.2" step="0.1"></div>
      </div>
      <div class="desc">浏览器直连 t.me 会被 CORS 拦截，实际走公共代理，速度受限。低并发 + 延迟，避免触发 Telegram 限流。数量建议控制在 1000 以内。</div>
      <div class="btn-row">
        <button class="btn primary" id="sc-start" onclick="startScan()">开始扫描</button>
        <button class="btn danger" id="sc-stop" onclick="stopScan()" disabled>停止</button>
      </div>
    </div>

    <div id="sc-progress" class="card hidden">
      <div class="progress-track"><div class="progress-fill" id="sc-bar"></div></div>
      <div class="stats" id="sc-stats"></div>
      <div id="sc-msg"></div>
    </div>
    <div id="sc-results"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const GRADE_COLORS = { T0: '#ffd700', T1: '#c084fc', T2: '#60a5fa', T3: '#22d3ee', T4: '#4ade80', T5: '#94a3b8' };

/* ---------- 内置词表（407 个） ---------- */
const WORDS = new Set(["news", "bank", "shop", "love", "king", "god", "btc", "eth", "ai", "vip", "pro", "max", "top", "best", "money", "stock", "music", "movie", "world", "earth", "china", "apple", "wechat", "taobao", "wallet", "market", "google", "trade", "cash", "coin", "token", "crypto", "bitcoin", "invest", "finance", "loan", "pay", "gold", "fund", "usd", "cny", "yuan", "price", "profit", "rich", "wealth", "forex", "bond", "debit", "credit", "save", "capital", "assets", "equity", "tax", "earn", "bonus", "salary", "income", "broker", "exchange", "mining", "stake", "nft", "defi", "fintech", "tech", "app", "web", "net", "cloud", "data", "code", "bot", "chat", "mail", "email", "pixel", "byte", "chip", "cpu", "gpu", "wifi", "linux", "java", "python", "node", "soft", "os", "api", "www", "com", "org", "edu", "biz", "url", "dns", "http", "vpn", "cyber", "digital", "online", "server", "smart", "mobile", "phone", "telecom", "network", "internet", "software", "hardware", "update", "system", "security", "privacy", "login", "password", "username", "domain", "website", "homepage", "blog", "forum", "wiki", "repo", "git", "dev", "ops", "saas", "paas", "iot", "ar", "vr", "ml", "dl", "nlp", "shop", "store", "mall", "buy", "sale", "deal", "luxury", "brand", "goods", "corp", "inc", "ltd", "ceo", "cfo", "cto", "boss", "company", "factory", "love", "life", "happy", "lucky", "king", "queen", "prince", "princess", "hero", "god", "angel", "star", "sun", "moon", "sky", "sea", "fire", "ice", "rain", "wind", "home", "house", "city", "world", "earth", "china", "japan", "korea", "paris", "london", "usa", "nyc", "beijing", "shanghai", "hongkong", "india", "russia", "germany", "france", "italy", "spain", "brazil", "canada", "australia", "dubai", "singapore", "tokyo", "seoul", "media", "tv", "radio", "music", "movie", "film", "art", "photo", "pic", "book", "read", "write", "talk", "speak", "song", "dance", "game", "play", "win", "lol", "fun", "cool", "sport", "football", "soccer", "basketball", "tennis", "golf", "fitness", "gym", "yoga", "travel", "tour", "trip", "hotel", "food", "coffee", "tea", "pizza", "sushi", "beer", "wine", "club", "party", "concert", "festival", "friend", "family", "baby", "kid", "boy", "girl", "man", "woman", "dad", "mom", "bro", "sis", "team", "group", "chat", "channel", "community", "social", "people", "human", "person", "time", "day", "night", "morning", "noon", "evening", "week", "month", "year", "today", "tomorrow", "yesterday", "now", "new", "old", "good", "bad", "big", "small", "fast", "slow", "hot", "cold", "warm", "sweet", "nice", "great", "super", "mega", "ultra", "hyper", "free", "open", "safe", "easy", "simple", "first", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "hundred", "thousand", "million", "zero", "tree", "flower", "grass", "mountain", "river", "lake", "ocean", "beach", "forest", "animal", "dog", "cat", "bird", "fish", "horse", "tiger", "lion", "bear", "wolf", "panda", "rabbit", "dragon", "phoenix", "da", "xiao", "wang", "zhang", "li", "chen", "liu", "yang", "huang", "zhao", "wu", "zhou", "xu", "sun", "ma", "zhu", "hu", "guo", "he", "lin", "luo", "gao", "tang", "qian", "shen", "han", "feng", "deng", "cao", "peng", "xie", "fan", "song", "pan", "yuan", "dong", "cheng", "du", "wei", "jiang", "lu", "yao", "jiao", "hong", "yan", "kang", "dai", "xin", "xue", "qing", "hao", "shan", "shui", "huo", "jin", "mu", "tu", "ri", "yue", "xing", "long", "niu", "yang", "ji", "gou", "zhu", "she", "hou", "chun", "xia", "qiu", "dong", "ai", "shu", "xiang", "xing", "yun", "fa", "cai", "cheng", "gong", "hui", "yuan", "jin", "bi"]);

/* ---------- CORS 代理列表（按顺序尝试） ---------- */
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('tab-' + t.dataset.tab).classList.add('active');
}));

/* ---------- 模式字段切换 ---------- */
function toggleModeFields() {
  const mode = $('sc-mode').value;
  ['f-words', 'f-length', 'f-random', 'f-dict'].forEach(id => $('#' + id).classList.toggle('hidden', id !== 'f-' + mode));
}

/* ---------- 代理抓取 ---------- */
async function fetchViaProxy(url) {
  for (const p of PROXIES) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 20000);
      const r = await fetch(p(url), { signal: ctrl.signal });
      clearTimeout(t);
      if (r.ok) return r;
    } catch (e) { /* 换下一个代理 */ }
  }
  return null;
}

/* ---------- 单用户名检查 ---------- */
async function checkOne(name) {
  const url = 'https://t.me/' + name;
  const r = await fetchViaProxy(url);
  if (!r) return { exists: 'error', status: 0 };
  if (r.status === 404) return { exists: false, status: 404 };
  if (r.status === 429 || r.status === 403) return { exists: null, status: r.status };
  const html = await r.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const meta = prop => { const el = doc.querySelector('meta[property="' + prop + '"]') || doc.querySelector('meta[name="' + prop + '"]'); return el ? el.getAttribute('content') || '' : ''; };
  const title = meta('og:title') || meta('twitter:title') || '@' + name;
  const desc = meta('og:description') || meta('twitter:description') || '';
  const image = meta('og:image') || '';
  const extraEl = doc.querySelector('.tgme_page_extra');
  const extra = extraEl ? extraEl.textContent.trim() : '';
  let type = 'user';
  if (extra.indexOf('subscribers') >= 0) type = 'channel';
  else if (extra.indexOf('members') >= 0) type = 'group';
  else if (desc.toLowerCase().indexOf('bot') >= 0) type = 'bot';
  let member_count = 0;
  const m = extra.match(/[\d][\d\s.,kKmM]*/);
  if (m && (extra.indexOf('subscribers') >= 0 || extra.indexOf('members') >= 0)) {
    const raw = m[0].replace(/[\s,]/g, '');
    if (raw.indexOf('k') >= 0) member_count = Math.round(parseFloat(raw) * 1000);
    else if (raw.indexOf('m') >= 0) member_count = Math.round(parseFloat(raw) * 1000000);
    else member_count = parseInt(raw) || 0;
  }
  return { exists: true, status: 200, title, desc, image, extra, type, member_count };
}

/* ---------- 分级（与 CLI 版一致） ---------- */
function grade(name) {
  const u = name.toLowerCase();
  const len = u.length;
  const alphaOnly = /^[a-z]+$/.test(u);
  const valid = /^[a-z0-9_]+$/.test(u);
  if (!valid) return null;
  if (alphaOnly) {
    if (len <= 4) return 'T0';
    if (len === 5) return WORDS.has(u) ? 'T1' : 'T3';
    if (len >= 6 && len <= 7) return WORDS.has(u) ? 'T2' : 'T3';
    if (len <= 12) return 'T4';
    return 'T5';
  }
  return 'T5';
}

/* ---------- 快速查询 ---------- */
async function doLookup() {
  const names = $('lu-name').value.split(/[,，\s]+/).map(s => s.replace(/^@/, '')).filter(Boolean);
  if (!names.length) { $('lu-msg').innerHTML = '<div class="err">请输入用户名</div>'; return; }
  const btn = $('lu-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>查询中...';
  $('lu-msg').innerHTML = ''; $('lu-results').innerHTML = '';
  for (const name of names) {
    const box = document.createElement('div');
    box.className = 'res-card';
    box.innerHTML = '<div style="flex:1;text-align:center;padding:10px"><span class="spin"></span>查询 @' + name + '</div>';
    $('lu-results').appendChild(box);
    try {
      const data = await checkOne(name);
      if (data.exists === 'error') { box.innerHTML = '<div class="res-info"><div class="res-top"><span class="res-name">@' + name + '</span><span class="tag no">错误</span></div><div class="err">所有代理均失败，请稍后重试</div></div>'; continue; }
      if (data.exists === false) { box.innerHTML = '<div class="res-info"><div class="res-top"><span class="res-name">@' + name + '</span><span class="tag no">未占用 · 可注册</span></div><div class="res-sub">' + grade(name) + '</div></div>'; continue; }
      if (data.exists === null) { box.innerHTML = '<div class="res-info"><div class="res-top"><span class="res-name">@' + name + '</span><span class="tag no">状态码 ' + data.status + '</span></div><div class="err">可能被限流，稍后重试</div></div>'; continue; }
      const typeTag = { user: '个人用户', channel: '频道', group: '群组', bot: '机器人' }[data.type] || data.type;
      const typeCls = { user: 'user', channel: 'channel', group: 'group', bot: 'bot' }[data.type] || 'user';
      const avatar = data.image ? '<img class="res-avatar" src="' + data.image + '" onerror="this.style.display=\'none\'">' : '<div class="res-avatar"></div>';
      const members = data.member_count ? '<div class="res-sub">成员数：' + data.member_count.toLocaleString() + '</div>' : (data.extra ? '<div class="res-sub">' + data.extra + '</div>' : '');
      box.innerHTML = avatar + '<div class="res-info"><div class="res-top"><span class="res-name">' + data.title + '</span><span class="tag ok">已占用</span><span class="tag ' + typeCls + '">' + typeTag + '</span></div>' + members + (data.desc ? '<div class="res-desc">' + data.desc + '</div>' : '') + '<div class="res-link">https://t.me/' + name + '</div></div>';
    } catch (e) {
      box.innerHTML = '<div class="res-info"><div class="res-top"><span class="res-name">@' + name + '</span><span class="tag no">错误</span></div><div class="err">' + e.message + '</div></div>';
    }
  }
  btn.disabled = false; btn.innerHTML = '查询';
}

/* ---------- 批量筛查 ---------- */
let scanRunning = false;
let scanStop = false;

function toggleModeFieldsScan() { toggleModeFields(); }

function genCandidates(mode) {
  const out = [];
  if (mode === 'words') {
    const extra = $('sc-extra').value.split(/[\s,，]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
    out.push(...WORDS, ...extra.filter(w => /^[a-z0-9_]{5,}$/.test(w)));
  } else if (mode === 'length') {
    const len = parseInt($('sc-length').value) || 4;
    const cs = $('sc-charset').value;
    const chars = cs === 'lowercase' ? 'abcdefghijklmnopqrstuvwxyz' : cs === 'digits' ? '0123456789' : 'abcdefghijklmnopqrstuvwxyz0123456789_';
    const total = Math.pow(chars.length, len);
    const cap = Math.min(total, 5000);
    out.push('-- ' + cap + ' 条');
    for (let i = 0; i < cap; i++) {
      let s = ''; let x = i;
      for (let j = 0; j < len; j++) { s += chars[x % chars.length]; x = Math.floor(x / chars.length); }
      out.push(s);
    }
  } else if (mode === 'random') {
    const n = parseInt($('sc-count').value) || 200;
    const min = parseInt($('sc-min').value) || 5;
    const max = parseInt($('sc-max').value) || 5;
    const cs = $('sc-charset-r').value;
    const chars = cs === 'lowercase' ? 'abcdefghijklmnopqrstuvwxyz' : cs === 'digits' ? '0123456789' : 'abcdefghijklmnopqrstuvwxyz0123456789_';
    const seen = new Set();
    while (seen.size < n) {
      const l = min + Math.floor(Math.random() * (max - min + 1));
      let s = '';
      for (let j = 0; j < l; j++) s += chars[Math.floor(Math.random() * chars.length)];
      seen.add(s);
    }
    out.push(...seen);
  } else if (mode === 'dict') {
    out.push(...$('sc-dict').value.split(/\s+/).map(s => s.replace(/^@/, '').toLowerCase()).filter(Boolean));
  }
  return out.filter(s => !s.startsWith('-- '));
}

async function startScan() {
  if (scanRunning) return;
  const mode = $('sc-mode').value;
  const candidates = genCandidates(mode);
  if (!candidates.length) { $('sc-msg').innerHTML = '<div class="err">没有候选用户名</div>'; return; }
  const workers = parseInt($('sc-workers').value) || 3;
  const delay = parseFloat($('sc-delay').value) || 1.0;
  scanRunning = true; scanStop = false;
  $('sc-start').disabled = true; $('sc-stop').disabled = false;
  $('sc-results').innerHTML = ''; $('sc-msg').innerHTML = '';
  $('sc-progress').classList.remove('hidden');

  const grades = { T0: [], T1: [], T2: [], T3: [], T4: [], T5: [] };
  let processed = 0, taken = 0, limited = 0, errors = 0;
  const startedAt = Date.now();

  const updateStats = () => {
    const pct = candidates.length ? processed / candidates.length * 100 : 0;
    $('sc-bar').style.width = pct.toFixed(1) + '%';
    const avail = Object.values(grades).reduce((a, b) => a + b.length, 0);
    $('sc-stats').innerHTML =
      '<div class="stat"><b>' + processed.toLocaleString() + '</b><span>已检查 / 共 ' + candidates.length.toLocaleString() + '</span></div>' +
      '<div class="stat"><b style="color:var(--green)">' + avail.toLocaleString() + '</b><span>可用</span></div>' +
      '<div class="stat"><b style="color:var(--blue)">' + taken.toLocaleString() + '</b><span>已占用</span></div>' +
      '<div class="stat"><b style="color:var(--amber)">' + limited.toLocaleString() + '</b><span>受限</span></div>' +
      '<div class="stat"><b style="color:var(--red)">' + errors.toLocaleString() + '</b><span>错误</span></div>' +
      '<div class="stat"><b>' + ((Date.now() - startedAt) / 1000).toFixed(0) + 's</b><span>耗时</span></div>';
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let idx = 0;

  const worker = async () => {
    while (scanRunning && !scanStop) {
      const i = idx++;
      if (i >= candidates.length) break;
      const name = candidates[i];
      try {
        const data = await checkOne(name);
        if (data.exists === false) { const g = grade(name); if (g) grades[g].push(name); }
        else if (data.exists === true) taken++;
        else if (data.exists === null) limited++;
        else errors++;
      } catch (e) { errors++; }
      processed++;
      if (i % 5 === 0) updateStats();
      if (delay > 0) await sleep(delay * 1000);
    }
  };

  const pool = [];
  for (let w = 0; w < workers; w++) pool.push(worker());
  await Promise.all(pool);
  scanRunning = false;
  updateStats();
  $('sc-start').disabled = false; $('sc-stop').disabled = true;
  if (scanStop) { $('sc-msg').innerHTML = '<div class="msg">已手动停止</div>'; scanStop = false; }
  renderResults(grades);
}

function stopScan() { scanStop = true; }

function renderResults(grades) {
  window.__grades = grades;
  const box = $('sc-results');
  box.innerHTML = '';
  const order = ['T0', 'T1', 'T2', 'T3', 'T4', 'T5'];
  order.forEach(g => {
    const names = grades[g] || [];
    const block = document.createElement('div');
    block.className = 'grade-block';
    let head = '<div class="grade-head"><span class="grade-dot" style="background:' + GRADE_COLORS[g] + '"></span><b>' + g + '</b><span>' + names.length.toLocaleString() + ' 个可用</span>';
    if (names.length) head += '<button class="btn small green" onclick="downloadGrade(\'' + g + '\', this)">下载</button>';
    head += '</div>';
    block.innerHTML = head;
    if (!names.length) block.innerHTML += '<div class="empty">无</div>';
    else {
      const chips = document.createElement('div');
      chips.className = 'chips';
      names.slice(0, 200).forEach(n => {
        const c = document.createElement('span');
        c.className = 'chip g-' + g.toLowerCase();
        c.textContent = n;
        c.title = '点击复制';
        c.onclick = () => copyName(c, n);
        chips.appendChild(c);
      });
      block.appendChild(chips);
      if (names.length > 200) block.innerHTML += '<div class="desc">仅显示前 200 个，完整名单请下载。</div>';
    }
    box.appendChild(block);
  });
}

function copyName(el, name) {
  navigator.clipboard.writeText(name).then(() => {
    el.classList.add('copied');
    el.textContent = '✓ ' + name;
    setTimeout(() => { el.classList.remove('copied'); el.textContent = name; }, 1200);
  });
}

function downloadGrade(g, btn) {
  const text = window.__grades[g].join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tg_' + g + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
</script>
